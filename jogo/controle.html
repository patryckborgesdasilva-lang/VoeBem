<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09160d">
<title>Controle · Parcelei e Fui</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Controle de videogame no celular: direcional à esquerda, PULAR à direita, pausa no meio. */
:root {
  --ink: #09160d;
  --panel: #0d2414;
  --white: #ffffff;
  --lime: #93c06c;
  --orange: #ff650e;
  --gold: #ffd34d;
  --me: #93c06c;
  --f-8bit: 'Press Start 2P', 'Courier New', ui-monospace, monospace;
  --f-text: 'VT323', 'Courier New', ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; touch-action: none; }
html, body { height: 100%; margin: 0; overflow: hidden; position: fixed; inset: 0; width: 100%; }
body {
  background: var(--ink); color: var(--white); font: 20px/1.1 var(--f-text);
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.pad {
  height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  gap: 10px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.who { margin: 0; font: clamp(12px, 3.6vw, 18px) var(--f-8bit); color: var(--me); text-transform: uppercase; text-shadow: 3px 3px 0 #000; }
.hearts { display: flex; gap: 4px; min-height: 14px; }
.hearts i { width: 16px; height: 14px; background: var(--orange); clip-path: polygon(14% 0, 43% 0, 50% 17%, 57% 0, 86% 0, 100% 17%, 100% 50%, 50% 100%, 0 50%, 0 17%); }
.hearts i.off { background: #ffffff33; }
.status { margin: 0; font: 9px/1.5 var(--f-8bit); color: var(--gold); text-transform: uppercase; text-align: right; }
.status.ok { color: var(--lime); }
.small-btn { font: 10px var(--f-8bit); color: var(--white); background: var(--panel); border: 3px solid var(--white); padding: 12px 14px; }
.small-btn.on { background: var(--gold); color: var(--ink); }
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; min-height: 0; }
.dpad { display: flex; gap: 12px; justify-content: flex-start; height: 100%; max-height: 260px; }
.btn {
  display: grid; place-items: center; border: 4px solid var(--white); background: var(--panel); color: var(--white);
  font: clamp(22px, 7vw, 40px) var(--f-8bit); box-shadow: 0 0 0 4px var(--ink), 6px 6px 0 4px #000;
}
.dpad .btn { flex: 1 1 0; min-width: 0; max-width: 150px; }
.btn.on { background: var(--gold); color: var(--ink); transform: translate(3px, 3px); box-shadow: 0 0 0 4px var(--ink), 3px 3px 0 4px #000; }
.mid { display: grid; gap: 12px; justify-items: center; }
.jump { justify-self: end; width: min(42vw, 230px); aspect-ratio: 1; max-height: 100%; border-radius: 50%; background: var(--orange); font-size: clamp(14px, 4vw, 22px); }
.jump.on { background: var(--gold); }
.msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(9, 22, 13, .94); text-align: center; z-index: 5; }
.msg div { display: grid; gap: 16px; max-width: 34ch; }
.msg h1 { margin: 0; font: 16px/1.5 var(--f-8bit); color: var(--gold); text-transform: uppercase; }
.msg p { margin: 0; font-size: 24px; }
@media (orientation: portrait) {
  .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); }
  .dpad { order: 3; max-height: 200px; }
  .mid { order: 2; }
  .jump { order: 1; justify-self: center; width: min(56vw, 240px); }
}
</style>
</head>
<body>
<main class="pad">
  <header class="top">
    <div>
      <p class="who" id="who">Controle</p>
      <div class="hearts" id="hearts" aria-label="Corações"></div>
    </div>
    <p class="status" id="status">Conectando…</p>
  </header>
  <section class="board" aria-label="Controle">
    <div class="dpad">
      <button type="button" class="btn" data-k="l" aria-label="Esquerda">◀</button>
      <button type="button" class="btn" data-k="r" aria-label="Direita">▶</button>
    </div>
    <div class="mid">
      <button type="button" class="small-btn" id="pauseBtn">PAUSA</button>
      <button type="button" class="small-btn" id="fsBtn">TELA CHEIA</button>
    </div>
    <button type="button" class="btn jump" data-k="j" aria-label="Pular">PULAR</button>
  </section>
</main>
<div class="msg" id="msg" hidden><div><h1 id="msgTitle"></h1><p id="msgText"></p></div></div>
<script src="vendor/peerjs.min.js"></script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var sala = (q.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var p = q.get('p') === '1' ? 1 : 0;
  var NAMES = ['Patryck', 'Mari'], COLORS = ['#93c06c', '#ffad4d'];
  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.style.setProperty('--me', COLORS[p]);
  $('who').textContent = NAMES[p];
  document.title = 'Controle ' + NAMES[p] + ' · Parcelei e Fui';

  function showMsg(t, txt) { $('msgTitle').textContent = t; $('msgText').textContent = txt; $('msg').hidden = false; }
  function setStatus(t, ok) { $('status').textContent = t; $('status').classList.toggle('ok', !!ok); }
  if (!sala) { showMsg('Código inválido', 'Abra este controle lendo o QR code que aparece na tela do jogo, no computador.'); return; }
  if (typeof window.Peer !== 'function' || typeof window.RTCPeerConnection !== 'function') { showMsg('Navegador sem suporte', 'Abra o QR code no Chrome ou no Safari do celular.'); return; }

  function tapOn(el, fn) {
    var down = false;
    el.addEventListener('pointerdown', function (e) { down = true; e.preventDefault(); el.classList.add('on'); });
    el.addEventListener('pointerleave', function () { down = false; el.classList.remove('on'); });
    el.addEventListener('pointerup', function (e) { el.classList.remove('on'); if (down) { down = false; e.preventDefault(); fn(); } });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
  }
  // estado dos botões, com vários dedos ao mesmo tempo e deslizando entre ◀ e ▶
  var state = { l: false, r: false, j: false }, pointers = {};
  var btns = Array.prototype.slice.call(document.querySelectorAll('[data-k]'));
  function keyAt(x, y) { var el = document.elementFromPoint(x, y); var b = el && el.closest ? el.closest('[data-k]') : null; return b ? b.dataset.k : null; }
  function recompute() {
    var next = { l: false, r: false, j: false };
    Object.keys(pointers).forEach(function (id) { var k = pointers[id]; if (k) next[k] = true; });
    var changed = next.l !== state.l || next.r !== state.r || next.j !== state.j;
    var pressedNew = (next.l && !state.l) || (next.r && !state.r) || (next.j && !state.j);
    state = next;
    btns.forEach(function (b) { b.classList.toggle('on', !!state[b.dataset.k]); });
    if (changed) { send(); if (pressedNew && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} } }
  }
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.small-btn')) return;
    e.preventDefault(); pointers[e.pointerId] = keyAt(e.clientX, e.clientY); recompute();
  }, { passive: false });
  document.addEventListener('pointermove', function (e) {
    if (!(e.pointerId in pointers)) return;
    e.preventDefault(); pointers[e.pointerId] = keyAt(e.clientX, e.clientY); recompute();
  }, { passive: false });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { delete pointers[e.pointerId]; recompute(); });
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // sem zoom: toque duplo, pinça e rolagem ficam bloqueados (o Safari do iPhone ignora o user-scalable=no)
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
  });
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  // se mesmo assim o navegador ampliar a tela, volta pro tamanho normal
  var vp = document.querySelector('meta[name="viewport"]'), VPC = vp.getAttribute('content');
  function unzoom() {
    if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
    vp.setAttribute('content', VPC + ', minimum-scale=1');
    setTimeout(function () { vp.setAttribute('content', VPC); }, 60);
    pointers = {}; recompute();
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', unzoom); setInterval(unzoom, 700); }
  window.addEventListener('blur', function () { pointers = {}; recompute(); });

  // conexão com o computador
  var cfg = { debug: 0 }, ph = q.get('peerhost');
  if (ph) { var hp = ph.split(':'); cfg = { host: hp[0], port: +hp[1] || 9000, path: '/', secure: false, debug: 0 }; }
  var peer = null, conn = null, retry = null;
  function send(extra) {
    if (!conn || !conn.open) return;
    try { conn.send(extra || { t: 'in', l: state.l, r: state.r, j: state.j }); } catch (e) {}
  }
  function connect() {
    clearTimeout(retry);
    setStatus('Conectando…');
    if (!peer || peer.destroyed) {
      peer = new window.Peer(cfg);
      peer.on('open', function () { link(); });
      peer.on('error', function (e) {
        if (e && e.type === 'peer-unavailable') { setStatus('Jogo não encontrado'); showMsg('Jogo não encontrado', 'Confira se a tela dos QR codes ainda está aberta no computador e leia o código de novo.'); }
        else setStatus('Sem conexão');
        retry = setTimeout(connect, 2500);
      });
      peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
    } else link();
  }
  function link() {
    if (conn) { try { conn.close(); } catch (e) {} }
    conn = peer.connect('parceleiefui-' + sala, { metadata: { p: p }, reliable: true });
    conn.on('open', function () { $('msg').hidden = true; setStatus('Conectado', true); send(); });
    conn.on('data', function (d) {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'buzz' && navigator.vibrate) { try { navigator.vibrate([90, 40, 90]); } catch (e) {} }
      if (d.t === 'st') {
        var h = '';
        if (typeof d.hp === 'number') for (var i = 0; i < 3; i++) h += '<i class="' + (i < d.hp ? '' : 'off') + '"></i>';
        $('hearts').innerHTML = h;
      }
    });
    conn.on('close', function () { setStatus('Desconectado'); retry = setTimeout(connect, 2000); });
  }
  connect();
  // reenvia o estado de tempos em tempos (se uma mensagem se perder, o jogo se corrige sozinho)
  setInterval(function () { send(); }, 400);

  tapOn($('pauseBtn'), function () { send({ t: 'pause' }); if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} } });
  tapOn($('fsBtn'), function () {
    var el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(function () {}); } catch (e) {}
    try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
  });
  // mantém a tela do celular acesa durante o jogo
  function wake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
  wake(); document.addEventListener('visibilitychange', function () { if (!document.hidden) { wake(); if (!conn || !conn.open) connect(); } });
})();
</script>
</body>
</html>
